<title>Wall Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style id="css">
/* Layout: a printed wall-calendar spread (three month sheets on one line) under a slim header; lists and settings live in tabs. */
:root{
  --paper:#F7F7F4; --panel:#FFFFFF; --pad:#F1F1ED; --chip:#ECEDE8;
  --ink:#15181C; --ink-2:#4A5058; --ink-3:#858B92;
  --rule:#DCDED8; --rule-strong:#B4B9B2; --cross:#C9CCC5;
  --past:#E9EAE6; --past-ink:#9A9FA5; --weekend:#F3F2EC;
  --today:#15181C; --today-ink:#F7F7F4; --today-wash:#FFF6D8;
  --gym:#2E7D4F; --on-gym:#FFFFFF; --run:#D0A21C; --on-run:#241C00;
  --u1:#FFF2C6; --u1-ink:#6B5300; --u2:#FCE2CC; --u2-ink:#8A4510; --u3:#F9D7D3; --u3-ink:#9B1C1C;
  --shadow:0 18px 50px rgba(18,22,28,.18);
  --c-maths:#2F5D9E; --c-physics:#6A4C9C; --c-chemistry:#B5651D; --c-english:#A33B5B; --c-other:#2D7A73; --c-event:#2D7A73;
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-ui:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --font-cond:"IBM Plex Sans Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --row:96px; --row-min:76px; --months:3; --wn:24px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#121417; --panel:#1A1D21; --pad:#16181B; --chip:#24282D;
  --ink:#E8E9E5; --ink-2:#B4B8B6; --ink-3:#7E848A;
  --rule:#2B2F34; --rule-strong:#454A51; --cross:#33373C;
  --past:#1E2125; --past-ink:#6C7278; --weekend:#181B1E;
  --today:#E8E9E5; --today-ink:#121417; --today-wash:#2A2717;
  --gym:#4FB37A; --on-gym:#0E1A13; --run:#E3B53E; --on-run:#1C1600;
  --u1:#3A3216; --u1-ink:#F0D98C; --u2:#40291A; --u2-ink:#F3B98C; --u3:#45201E; --u3-ink:#F4A9A1;
  --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#121417; --panel:#1A1D21; --pad:#16181B; --chip:#24282D;
  --ink:#E8E9E5; --ink-2:#B4B8B6; --ink-3:#7E848A;
  --rule:#2B2F34; --rule-strong:#454A51; --cross:#33373C;
  --past:#1E2125; --past-ink:#6C7278; --weekend:#181B1E;
  --today:#E8E9E5; --today-ink:#121417; --today-wash:#2A2717;
  --gym:#4FB37A; --on-gym:#0E1A13; --run:#E3B53E; --on-run:#1C1600;
  --u1:#3A3216; --u1-ink:#F0D98C; --u2:#40291A; --u2-ink:#F3B98C; --u3:#45201E; --u3-ink:#F4A9A1;
  --shadow:0 18px 50px rgba(0,0,0,.5); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{padding-inline:clamp(32px,2.2vw,40px);padding-block:22px 24px;display:flex;flex-direction:column;gap:20px;min-height:100%}
.view{display:flex;flex-direction:column;gap:20px;min-width:0}

/* header */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px 24px}
.controls{grid-column:3;justify-self:end;display:flex;align-items:center;gap:12px}
.brand{grid-column:1;display:flex;flex-direction:column;gap:7px;min-width:0}
.wordmark{font-family:var(--font-display);font-stretch:125%;font-weight:800;font-size:20px;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.todayline{color:var(--ink-2);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todayline b{color:var(--ink);font-weight:600}
.tabs{display:flex;gap:2px;background:var(--chip);padding:3px;border-radius:9px}
.tab{border:0;background:transparent;padding:6px 13px;border-radius:7px;font-weight:500;font-size:13px;color:var(--ink-2);cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-strong);background:var(--panel);padding:6px 12px;border-radius:8px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.primary:hover{opacity:.9}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--chip)}
.btn.danger{color:var(--u3-ink);border-color:var(--u3)}
.btn[disabled]{opacity:.45;cursor:default}
.iconbtn{width:30px;height:30px;justify-content:center;padding:0;font-size:16px}
.status{font-size:12.5px;color:var(--ink-2);background:var(--chip);border-radius:8px;padding:7px 12px}
.status.warn{background:var(--u1);color:var(--u1-ink)}

/* calendar bar */
.summary{display:flex;align-items:center;justify-content:space-between;gap:12px 40px;flex-wrap:wrap;padding:12px 18px;border:1px solid var(--rule);border-radius:12px;background:var(--panel)}
.pager{grid-column:2;justify-self:center;display:flex;align-items:center;gap:8px}
.range{font-weight:600;font-size:14px;min-width:13ch;text-align:center;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--chip);border-radius:8px;padding:2px;margin-left:4px}
.seg button{border:0;background:transparent;padding:4px 9px;border-radius:6px;font-size:12px;font-weight:500;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.nextup{display:flex;align-items:center;gap:10px;flex:1 1 320px;min-width:0;overflow:hidden}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:34ch;padding:4px 4px 4px 11px;border:1px solid var(--rule);border-radius:999px;background:var(--panel);font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--rule-strong)}
.chip .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip .ct{overflow:hidden;text-overflow:ellipsis;min-width:0}
.cd{flex:none;font-weight:600;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink-2);font-variant-numeric:tabular-nums}
.cd.u1{background:var(--u1);color:var(--u1-ink)}.cd.u2{background:var(--u2);color:var(--u2-ink)}.cd.u3{background:var(--u3);color:var(--u3-ink)}
.muted{color:var(--ink-3);font-size:12.5px}
.train{display:grid;grid-template-columns:repeat(6,auto);justify-content:start;column-gap:20px;row-gap:7px;align-items:center;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.train b{color:var(--ink);font-weight:600}
.tk{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.tk i{width:12px;height:5px;border-radius:2px;background:var(--a)}
.strip{display:grid;grid-template-columns:repeat(30,5px);gap:2px}
.strip i{height:9px;border-radius:1.5px;background:var(--rule)}
.strip i.on{background:var(--a)}
.strip i.now{box-shadow:0 0 0 1px var(--ink)}
@media (max-width: 760px){ .train{grid-template-columns:repeat(3,auto)} .train .wide{display:none} }

/* the spread */
.spread{display:grid;grid-template-columns:repeat(var(--months),minmax(0,1fr));gap:clamp(16px,1.6vw,28px);align-items:start;margin-left:calc(-1*var(--wn))}
.month{display:flex;flex-direction:column;min-width:0;container-type:inline-size}
.mhead{margin-left:var(--wn);display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:9px;border-bottom:2px solid var(--ink)}
.mhead h2{margin:0;font-family:var(--font-display);font-stretch:125%;font-weight:800;font-size:clamp(15px,1.4vw,21px);letter-spacing:.05em;text-transform:uppercase;line-height:1;white-space:nowrap}
.mhead h2 span{font-weight:400;color:var(--ink-3);letter-spacing:.02em}
.mcap{font-size:12px;font-weight:500;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.mcap.now{color:var(--ink)}
.mright{display:flex;align-items:baseline;gap:18px;white-space:nowrap;line-height:1}
.tally{display:inline-flex;align-items:baseline;gap:14px;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tally>span{display:inline-flex;align-items:baseline;gap:5px}
.tally i{align-self:center;width:10px;height:4px;border-radius:2px;background:var(--a)}
.tally b{color:var(--ink);font-weight:600}
@container (max-width: 400px){ .tally .w{display:none} }
.wk{display:grid;grid-template-columns:var(--wn) repeat(7,minmax(0,1fr));padding:11px 0 7px}
.wk span{padding-left:6px;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.grid{display:grid;grid-template-columns:var(--wn) repeat(7,minmax(0,1fr));grid-auto-rows:minmax(var(--row-min),var(--row))}
.day.bt{border-top:1px solid var(--rule)}
.day.bl{border-left:1px solid var(--rule)}
.wk .wkg{padding:0 5px 0 0;text-align:right;letter-spacing:.04em}
.wn{display:flex;justify-content:flex-end;align-items:flex-start;padding:6px 4px 0 0;font:700 9px/1 var(--font-ui);letter-spacing:.02em;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;cursor:default}
.wn span{padding:2px 2px}
.wn.past{color:color-mix(in srgb,var(--ink-3) 55%,var(--paper))}
.wn.now span{padding:2px 3px;border-radius:3px;background:var(--today);color:var(--today-ink)}
.termrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.termrow .tn{flex:1 1 100%}
.termrow input[type="date"]{flex:0 0 8.7rem;width:8.7rem}
.day{position:relative;display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--panel);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);cursor:pointer;container-type:inline-size}
.day.pad{background:var(--pad);cursor:default}
.day:not(.pad):hover{box-shadow:inset 0 0 0 1px var(--rule-strong)}
.day.weekend{background:var(--weekend)}
.dhead{display:flex;align-items:center;gap:4px;padding:6px 6px 3px 7px;min-height:26px}
.dnum{font-family:var(--font-display);font-stretch:112%;font-weight:700;font-size:15px;line-height:1;font-variant-numeric:tabular-nums;margin-right:auto}
.tl{display:none;font-size:8.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-right:auto;margin-left:-2px}
.items{flex:1 1 auto;display:flex;flex-direction:column;gap:3px;padding:1px 4px 4px;min-height:0}
/* an assessment is a tile that fills the free space in its square; two on one day share it in halves */
.tiles{flex:1 1 auto;display:flex;flex-direction:column;gap:3px;min-height:0}
.tile{--c:var(--c-other);--on:#FFFFFF;container:tile/inline-size;flex:1 1 0;min-height:0;display:flex;align-items:center;padding:0 8px;border-radius:7px;overflow:hidden;color:var(--on);
  background:radial-gradient(120% 110% at 100% 0%,rgb(255 255 255/.2),rgb(255 255 255/0) 58%),linear-gradient(165deg,color-mix(in oklab,var(--c),#fff 6%),color-mix(in oklab,var(--c),#000 18%));
  box-shadow:inset 0 1px 0 rgb(255 255 255/.16),inset 0 0 0 1px rgb(0 0 0/.08),0 1px 2px rgb(0 0 0/.16)}
.tile b{--adv:.89;--fs:13cqi;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-family:var(--font-display);font-weight:800;font-stretch:112%;line-height:1.1;letter-spacing:.06em;text-transform:uppercase;text-wrap:balance;
  font-size:clamp(7.5px,min(var(--fs),100cqi/(var(--L,9)*var(--adv))),14px)}
.tile .ls{display:none}
.day.n2 .tile b{--fs:12cqi}
.compact .day.n2 .tile b{-webkit-line-clamp:1}
.tile.done{opacity:.5}
.tile.done b{text-decoration:line-through;text-decoration-thickness:1.5px}
.day:not(.past):hover .tile{filter:brightness(1.07)}
/* the longest word sets the size, so a name never breaks mid-word; narrow squares use the narrower cut, and the short name when tiny */
@container (max-width: 90px){ .tile{padding:0 5px;border-radius:5px} }
@container tile (max-width: 64px){ .tile b{--adv:.72;--fs:15.5cqi;font-stretch:92%;letter-spacing:.03em} }
/* switch to the short name once the full one can't fit; mNN = the width the full name needs */
@container tile (max-width: 70px){ .tile.m70 b{--L:var(--Ls)} .tile.m70 .lf{display:none} .tile.m70 .ls{display:inline} }
@container tile (max-width: 60px){ .tile.m60 b{--L:var(--Ls)} .tile.m60 .lf{display:none} .tile.m60 .ls{display:inline} }
@container tile (max-width: 50px){ .tile.m50 b{--L:var(--Ls)} .tile.m50 .lf{display:none} .tile.m50 .ls{display:inline} }
@container tile (max-width: 40px){ .tile.m40 b{--L:var(--Ls)} .tile.m40 .lf{display:none} .tile.m40 .ls{display:inline} }
@container tile (max-width: 30px){ .tile.m30 b{--L:var(--Ls)} .tile.m30 .lf{display:none} .tile.m30 .ls{display:inline} }
/* an event is a thin bar; across several days it runs on as one band, named where it starts and at each new week */
.evbar{--c:var(--c-event);flex:none;display:block;height:17px;padding:0 6px;border-radius:4px;background:color-mix(in srgb,var(--c) 24%,var(--panel));color:color-mix(in srgb,var(--c) 45%,var(--ink));font:600 10.5px/17px var(--font-cond);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evbar.cl{margin-left:-4px;border-top-left-radius:0;border-bottom-left-radius:0}
.evbar.cr{margin-right:-4px;border-top-right-radius:0;border-bottom-right-radius:0}
.more{margin-left:auto;padding:2px 6px;border-radius:999px;background:var(--chip);color:var(--ink-2);font:700 9.5px/1 var(--font-ui)}

/* training lanes along the foot of a day: left = gym, right = run */
.ac-gym{--a:var(--gym);--on:var(--on-gym)}
.ac-run{--a:var(--run);--on:var(--on-run)}
.lanes{position:absolute;left:4px;right:4px;bottom:4px;height:6px;display:grid;grid-template-columns:1fr 1fr;gap:3px;z-index:1}
.lane{display:flex;align-items:center;justify-content:center;min-width:0;height:100%;padding:0;border:1px dashed transparent;border-radius:3px;background:transparent;color:transparent;font:600 9.5px/1 var(--font-ui);letter-spacing:.02em;cursor:pointer;overflow:hidden;white-space:nowrap}
.lane[aria-pressed="true"]{background:var(--a);border:1px solid var(--a)}
.lane .s{display:none}
.lane:focus-visible{outline-offset:1px}
.day:hover .lanes,.day:focus-visible .lanes,.day:has(.lane:focus-visible) .lanes,.day.today .lanes{height:18px}
.day:hover .lane:not([aria-pressed="true"]),.day:focus-visible .lane:not([aria-pressed="true"]),.day:has(.lane:focus-visible) .lane:not([aria-pressed="true"]),.day.today .lane:not([aria-pressed="true"]){color:var(--ink-3);border-color:var(--rule-strong);background:var(--panel)}
.day:hover .lane[aria-pressed="true"],.day:focus-visible .lane[aria-pressed="true"],.day:has(.lane:focus-visible) .lane[aria-pressed="true"],.day.today .lane[aria-pressed="true"]{color:var(--on)}
.lane:not([aria-pressed="true"]):hover{border-style:solid!important;border-color:var(--a)!important;color:var(--a)!important;background:color-mix(in srgb,var(--a) 14%,var(--panel))!important}
.lane[aria-pressed="true"]:hover{filter:brightness(1.08)}
.day.has-lanes .items{padding-bottom:12px}
.day.today .items,.day.has-lanes:hover .items,.day.has-lanes:focus-visible .items,.day.has-lanes:has(.lane:focus-visible) .items{padding-bottom:25px}
@container (max-width: 58px){ .lane .f{display:none} .lane .s{display:inline} }
@media (hover:none){ .day.has-lanes .lanes{height:18px} .day.has-lanes .lane:not([aria-pressed="true"]){color:var(--ink-3);border-color:var(--rule-strong);background:var(--panel)} .day.has-lanes .lane[aria-pressed="true"]{color:var(--on)} .day.has-lanes .items{padding-bottom:25px} }

/* past: greyed and crossed off */
.day.past{background-color:var(--past);background-image:linear-gradient(to top right,transparent calc(50% - .7px),var(--cross) calc(50% - .7px),var(--cross) calc(50% + .7px),transparent calc(50% + .7px)),linear-gradient(to bottom right,transparent calc(50% - .7px),var(--cross) calc(50% - .7px),var(--cross) calc(50% + .7px),transparent calc(50% + .7px))}
.day.past .dnum{color:var(--past-ink);text-decoration:line-through;text-decoration-thickness:1.5px}
.day.past .tile{opacity:.5;filter:saturate(.6)}
.day.past .tile.done{opacity:.35}
.day.past .evbar{opacity:.6}

/* today */
.day.today{background:var(--today-wash);box-shadow:inset 0 0 0 2px var(--today)}
.day.today:hover{box-shadow:inset 0 0 0 2px var(--today)}
.day.today .dhead{background:var(--today);color:var(--today-ink)}
.day.today .dhead{flex-wrap:wrap;row-gap:2px;padding-bottom:4px}
.day.today .tl{display:block;order:3;flex-basis:100%;margin:0}


/* lists */
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.view-head h1{margin:0;font-family:var(--font-display);font-stretch:125%;font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.view-head p{margin:4px 0 0;color:var(--ink-2);font-size:13px;max-width:70ch}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--chip) 55%,transparent)}
tr.dim td{color:var(--ink-3)}
tr.done .nm{text-decoration:line-through}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.subj{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.subj i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.group-h td{background:var(--paper);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);cursor:default}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3)}
.check{width:17px;height:17px;accent-color:var(--gym);cursor:pointer;vertical-align:middle}

/* settings */
.settings{columns:4 330px;column-gap:16px}
.settings>.card{break-inside:avoid;margin:16px 0 0}
.settings>.card:first-child{margin-top:0}
.settings>.card.span{column-span:all}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.card p{margin:0;color:var(--ink-2);font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row label{min-width:9ch;font-size:13px;color:var(--ink-2)}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.colors label{display:flex;align-items:center;gap:8px;font-size:13px}
input[type="color"]{width:30px;height:24px;border:1px solid var(--rule);border-radius:6px;padding:0;background:none;cursor:pointer}
.subjrow{display:grid;grid-template-columns:minmax(0,1fr) 7.5rem 1.8rem;gap:6px;align-items:center}
.howto{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--ink-2)}
.howto b{color:var(--ink);font-weight:600}

/* forms + modal */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,#000 38%,transparent);display:grid;place-items:center;padding:16px;z-index:40}
.modal{width:min(540px,100%);max-height:calc(100% - 16px);overflow:auto;background:var(--panel);color:var(--ink);border-radius:14px;box-shadow:var(--shadow);padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-family:var(--font-display);font-stretch:118%;font-weight:800;font-size:19px;letter-spacing:.02em}
.mtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sub{color:var(--ink-2);font-size:13px;margin-top:3px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field span{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.field span em{font-style:normal;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-3)}
.field input,.field select,.field textarea,.inp{width:100%;border:1px solid var(--rule-strong);border-radius:8px;background:var(--panel);padding:8px 10px;font-size:14px;min-width:0}
.field textarea{resize:vertical;min-height:62px}
.inline-check{display:flex;align-items:center;gap:8px;font-size:14px}
.swatches{display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding-top:2px}
.swatch{--sw:var(--c-event);position:relative;flex:none;width:26px;height:26px;padding:0;border:0;border-radius:50%;background:var(--sw);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.swatch[aria-pressed="true"],.swatch.cust.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--sw)}
.swatch.def{width:auto;display:inline-flex;align-items:center;gap:6px;padding:0 11px 0 5px;border-radius:999px;background:var(--chip);color:var(--ink-2);font-size:12px;font-weight:500}
.swatch.def i{width:16px;height:16px;border-radius:50%;background:var(--c-event)}
.swatch.def[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--c-event)}
.swatch.cust{overflow:hidden;background:conic-gradient(#B23A3A,#B7791F,#6B7A2A,#1F7A99,#4C51BF,#8E3B8E,#B23A3A)}
.swatch.cust.on{background:var(--sw)}
.swatch.cust input{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;opacity:0;cursor:pointer}
.err{color:var(--u3-ink);font-size:12.5px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.actions .left{margin-right:auto}
.dlist{display:flex;flex-direction:column;gap:8px}
.ditem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--rule);border-left:4px solid var(--c);border-radius:8px}
.ditem .t{font-weight:600}
.ditem .m{font-size:12.5px;color:var(--ink-2)}
.ditem.done .t{text-decoration:line-through;color:var(--ink-3)}
.gymrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:8px;background:var(--chip)}
.acts{display:flex;gap:8px}
.act{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;border:1px solid var(--rule-strong);background:var(--panel);font-weight:600;font-size:13px;cursor:pointer}
.act:hover{border-color:var(--a);color:var(--a)}
.act[aria-pressed="true"]{background:var(--a);border-color:var(--a);color:var(--on)}
.act[aria-pressed="true"]:hover{color:var(--on);filter:brightness(1.06)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;box-shadow:var(--shadow)}

@media (max-width: 1400px){
  .top{grid-template-columns:minmax(0,1fr) auto}
  .controls{grid-column:2}
  .pager{grid-row:2;grid-column:1/-1;justify-self:start}
}
@media (max-width: 980px){
  .app{padding-inline:20px}
  .spread{grid-template-columns:minmax(0,1fr);margin-left:0}
  .grid{grid-auto-rows:minmax(72px,auto)}
}
@media (max-width: 560px){
  .form{grid-template-columns:1fr}
  .dnum{font-size:13px}
  .nextup{flex-basis:100%}
}
@media (prefers-reduced-motion: no-preference){
  .day,.chip,.btn,.tab{transition:background-color .15s,box-shadow .15s,border-color .15s}
  .lanes{transition:height .14s ease}
  .items{transition:padding-bottom .14s ease}
  .tile{transition:filter .12s ease}
}
@media print{
  @page{size:A4 landscape;margin:8mm}
  .top .tabs,.top .btn,.pager .btn,.seg,.status,.toast,.overlay{display:none!important}
  .app{padding:0 0 0 var(--wn);gap:12px}
  .view{gap:12px}
  .lane:not([aria-pressed="true"]){visibility:hidden}
  .lanes{height:6px!important}
  .hint{display:none}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .day:not(.pad):hover{box-shadow:none}
}

<div class="app" id="app" lang="en-AU">
  <header class="top">
    <div class="brand">
      <div class="wordmark">Wall Calendar</div>
      <div class="todayline" id="todayline">&nbsp;</div>
    </div>
    <div class="pager" id="pager">
      <button class="btn ghost iconbtn" id="prevBtn" type="button" aria-label="Earlier months">‹</button>
      <span class="range" id="rangeLabel">&nbsp;</span>
      <button class="btn ghost iconbtn" id="nextBtn" type="button" aria-label="Later months">›</button>
      <button class="btn" id="todayBtn" type="button">Today</button>
      <div class="seg" role="group" aria-label="Months shown" id="monthsSeg">
        <button type="button" data-m="2" aria-pressed="false">2</button>
        <button type="button" data-m="3" aria-pressed="true">3</button>
        <button type="button" data-m="4" aria-pressed="false">4</button>
      </div>
    </div>
    <div class="controls">
      <nav class="tabs" role="tablist" aria-label="Views">
        <button class="tab" role="tab" id="tab-calendar" data-view="calendar" aria-selected="true">Calendar</button>
        <button class="tab" role="tab" id="tab-upcoming" data-view="upcoming" aria-selected="false">Upcoming</button>
        <button class="tab" role="tab" id="tab-items" data-view="items" aria-selected="false">Assessments</button>
        <button class="tab" role="tab" id="tab-settings" data-view="settings" aria-selected="false">Settings</button>
      </nav>
      <button class="btn primary" id="addBtn" type="button" data-add="1">+ Add</button>
    </div>
  </header>
  <div class="status" id="status" hidden></div>

  <section class="view" id="view-calendar" aria-labelledby="tab-calendar">
    <div class="summary">
      <div class="nextup" id="nextup"><span class="lbl">Next up</span><span class="muted">Loading…</span></div>
      <div class="train" id="train" aria-label="Training"></div>
    </div>
    <div class="spread" id="spread"></div>
  </section>

  <section class="view" id="view-upcoming" aria-labelledby="tab-upcoming" hidden></section>
  <section class="view" id="view-items" aria-labelledby="tab-items" hidden></section>
  <section class="view" id="view-settings" aria-labelledby="tab-settings" hidden></section>
</div>
<div class="overlay" id="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
/* ---------- dates: local calendar dates as "YYYY-MM-DD" ---------- */
const pad2=n=>String(n).padStart(2,"0");
const iso=(y,m,d)=>y+"-"+pad2(m)+"-"+pad2(d);
const parts=s=>{const a=s.split("-").map(Number);return {y:a[0],m:a[1],d:a[2]}};
const dn=s=>{const p=parts(s);return Math.round(Date.UTC(p.y,p.m-1,p.d)/864e5)};
const fromDn=n=>{const t=new Date(n*864e5);return iso(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate())};
const addDays=(s,n)=>fromDn(dn(s)+n);
const diffDays=(a,b)=>dn(b)-dn(a);
const dowMon0=s=>((dn(s)+3)%7+7)%7;            /* 1 Jan 1970 was a Thursday */
const dim=(y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate();
const mIdx=(y,m)=>y*12+(m-1);
const fromMIdx=i=>({y:Math.floor(i/12),m:((i%12)+12)%12+1});
const todayISO=()=>{const t=new Date();return iso(t.getFullYear(),t.getMonth()+1,t.getDate())};
function monthCells(y,m){const off=dowMon0(iso(y,m,1)),n=dim(y,m),out=[];for(let i=0;i<42;i++){const d=i-off+1;out.push(d>=1&&d<=n?iso(y,m,d):null)}return out}
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON3=MONTHS.map(m=>m.slice(0,3));
const DOW=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const DOW3=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const longDate=s=>{const p=parts(s);return DOW[dowMon0(s)]+" "+p.d+" "+MONTHS[p.m-1]+" "+p.y};
const shortDate=s=>{const p=parts(s);return DOW3[dowMon0(s)]+" "+p.d+" "+MON3[p.m-1]+" "+p.y};
const countdown=n=>n===0?"Today":n===1?"Tomorrow":n+" days";
const urg=n=>n<=2?"u3":n<=6?"u2":n<=14?"u1":"";
window.__wc={monthCells,dowMon0,addDays,diffDays,iso};   /* exposed for testing */

/* ---------- defaults ---------- */
const GROUPS=[["maths","Maths"],["physics","Physics"],["chemistry","Chemistry"],["english","English"],["other","Other"]];
const EVENT_COLORS=[["#b23a3a","Crimson"],["#b7791f","Ochre"],["#6b7a2a","Olive"],["#1f7a99","Cyan"],["#4c51bf","Indigo"],["#8e3b8e","Plum"],["#7a5230","Brown"],["#55657a","Slate"]];
const ACTS=[["gym","Gym"],["run","Run"]];
const TIP={gym:["Went to the gym? Click to tick","Gym done. Click to undo"],run:["Went for a run? Click to tick","Run done. Click to undo"]};
const TYPES=["Assessment Task","Exam","Assignment","Trial","HSC Exam","Homework","Presentation","Event","Other"];
const DEFAULTS={startMonth:"2026-10",months:3,
  terms:[{name:"Term 4",start:"2026-10-12",end:"2026-12-09"}],
  colors:{maths:"#2F5D9E",physics:"#6A4C9C",chemistry:"#B5651D",english:"#A33B5B",other:"#2D7A73",event:"#2D7A73",gym:"#2E7D4F",run:"#D0A21C"},
  subjects:[{name:"Mathematics Advanced",short:"Maths Adv",group:"maths"},{name:"Mathematics Extension 1",short:"Ext 1",group:"maths"},
    {name:"Mathematics Extension 2",short:"Ext 2",group:"maths"},{name:"Physics",short:"Physics",group:"physics"},
    {name:"Chemistry",short:"Chem",group:"chemistry"},{name:"English Advanced",short:"English",group:"english"},{name:"Other",short:"Other",group:"other"}]};
const clone=o=>JSON.parse(JSON.stringify(o));
function mergeSettings(d){const s=clone(DEFAULTS);if(!d||typeof d!=="object")return s;
  if(/^\d{4}-\d{2}$/.test(d.startMonth||""))s.startMonth=d.startMonth;
  if([2,3,4].includes(d.months))s.months=d.months;
  if(Array.isArray(d.terms)){const ok=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||"")?v:"";s.terms=d.terms.filter(x=>x&&typeof x==="object").slice(0,24).map(x=>({name:String(x.name||"").slice(0,24),start:ok(x.start),end:ok(x.end)}))}
  if(d.colors&&typeof d.colors==="object")for(const k of Object.keys(s.colors))if(/^#[0-9a-fA-F]{6}$/.test(d.colors[k]||""))s.colors[k]=d.colors[k];
  if(Array.isArray(d.subjects)&&d.subjects.length){const list=d.subjects.filter(x=>x&&typeof x.name==="string"&&x.name.trim()).map(x=>({name:x.name.trim().slice(0,60),short:String(x.short||x.name).trim().slice(0,14),group:GROUPS.some(g=>g[0]===x.group)?x.group:"other"}));if(list.length)s.subjects=list}
  return s}

/* ---------- state ---------- */
const S={items:new Map(),gym:new Set(),run:new Set(),settings:clone(DEFAULTS),view:"calendar",offset:0,db:null,dl:null,
  loaded:{items:false,gym:false,run:false},readOnly:false,offline:false,busy:new Set(),modal:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const subjInfo=name=>S.settings.subjects.find(s=>s.name===name)||{name:name||"Other",short:name||"Other",group:"other"};
const groupOf=it=>it.type==="Event"?"other":subjInfo(it.subject).group;
const colorVar=g=>"var(--c-"+g+")";
const HEX=/^#[0-9a-fA-F]{6}$/;
const itemColor=it=>isEvent(it)?(HEX.test(it.color||"")?it.color:"var(--c-event)"):colorVar(subjInfo(it.subject).group);
const isEvent=it=>it.type==="Event";
/* what a day shows: the subject for an assessment ("Mathematics" shortened to "Maths" so it fits), the name for an event or an "Other" item */
const subjLabel=name=>String(name||"").replace(/\bMathematics\b/g,"Maths").replace(/\bExtension\b/g,"Ext");
function itemLabel(it){if(isEvent(it))return it.name||"Event";const sn=subjInfo(it.subject).name;return (!it.subject||sn==="Other")?(it.name||"Other"):subjLabel(sn)}
function itemHex(it){const c=S.settings.colors,v=isEvent(it)?(HEX.test(it.color||"")?it.color:c.event):c[subjInfo(it.subject).group]||c.other;return HEX.test(v||"")?v:"#2D7A73"}
function itemTip(it){const ev=isEvent(it);return (ev?"Event":subjInfo(it.subject).name)+" — "+(it.name||"")+(it.type&&!ev?" · "+it.type:"")+(it.weight?" · "+it.weight:"")+(it.done?" · completed":"")}
const longestWord=label=>Math.max(4,...String(label).split(/\s+/).map(w=>w.length));
function itemShort(it){if(isEvent(it))return it.name||"Event";const si=subjInfo(it.subject);return (!it.subject||si.name==="Other")?(it.name||"Other"):(si.short||subjLabel(si.name))}
const endOf=it=>(it.end&&it.end>it.date)?it.end:it.date;
function itemsList(){return [...S.items.entries()].map(([id,v])=>Object.assign({id},v)).filter(it=>typeof it.date==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(it.date))}
function sortKey(it){const si=S.settings.subjects.findIndex(s=>s.name===it.subject);return (isEvent(it)?1:0)+"|"+String(si<0?99:si).padStart(2,"0")+"|"+(it.name||"")}

/* ---------- toast + status ---------- */
let toastT;function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2600)}
function setStatus(msg,warn){const s=$("status");if(!msg){s.hidden=true;return}s.textContent=msg;s.className="status"+(warn?" warn":"");s.hidden=false}
function writeError(e){const c=e&&e.code;
  if(c==="invalid_argument"||c==="not_granted"||c==="revoked"){S.readOnly=true;setStatus("This calendar is view-only here, so changes can't be saved.",true)}
  else if(c==="quota_exceeded")setStatus("Storage is full. Delete some old items in Assessments, then try again.",true);
  else toast("Couldn't save just now. Try again in a moment.");}
function canWrite(){if(S.offline){toast("Saving works when this page is open in claude.ai while you're signed in.");return false}if(S.readOnly){toast("This calendar is view-only here.");return false}if(!S.db){toast("Still connecting. Try again in a second.");return false}return true}

/* ---------- writes ---------- */
async function toggleAct(kind,d){
  if(kind!=="gym"&&kind!=="run")return;
  if(d>todayISO()){toast("You can only tick today or earlier.");return}
  if(!canWrite())return; const key=kind+"/"+d; if(S.busy.has(key))return;
  const on=!S[kind].has(d); on?S[kind].add(d):S[kind].delete(d); S.busy.add(key); render();
  try{const ref=S.db.doc(key); if(on)await ref.set({date:d,at:Date.now()}); else await ref.delete()}
  catch(e){on?S[kind].delete(d):S[kind].add(d);writeError(e);render()}
  finally{S.busy.delete(key)}}
async function saveItem(id,body){if(!canWrite())return false;
  try{const ref=id?S.db.doc("items/"+id):S.db.collection("items").doc();await ref.set(body);S.items.set(ref.id,body);render();return true}
  catch(e){writeError(e);return false}}
async function deleteItem(id){if(!canWrite())return false;try{await S.db.doc("items/"+id).delete();S.items.delete(id);render();return true}catch(e){writeError(e);return false}}
async function toggleDone(id){if(!canWrite())return;const it=S.items.get(id);if(!it)return;const key="items/"+id;if(S.busy.has(key))return;
  const next=Object.assign({},it,{done:!it.done});S.items.set(id,next);S.busy.add(key);render();
  try{await S.db.doc(key).set(next)}catch(e){S.items.set(id,it);writeError(e);render()}finally{S.busy.delete(key)}}
let setT;function saveSettings(){applyColors();render();if(S.offline||S.readOnly||!S.db)return;clearTimeout(setT);setT=setTimeout(async()=>{try{await S.db.doc("config/settings").set(clone(S.settings))}catch(e){writeError(e)}},700)}

/* ---------- connect to storage ---------- */
async function connect(){
  const c=window.claude;
  if(!c||typeof c.use!=="function"){S.offline=true;setStatus("Preview only: saving works when this page is open in claude.ai while you're signed in.",true);render();return}
  let db=null;try{db=await c.use("db")}catch(e){db=null}
  try{S.dl=await c.use("downloads")}catch(e){S.dl=null}
  if(!db){S.offline=true;setStatus("Saving isn't available in this view. Open the page from claude.ai while signed in to tick days and add assessments.",true);render();return}
  S.db=db;
  const fail=e=>{if(e&&(e.code==="revoked"||e.code==="not_granted")){S.readOnly=true;setStatus("This calendar is view-only here.",true)}else setStatus("Lost the connection to your calendar data. Reload the page to reconnect.",true)};
  db.collection("items").onSnapshot(snap=>{S.items=new Map(snap.docs.map(d=>[d.id,d.data()]));S.loaded.items=true;render()},fail);
  for(const kind of ["gym","run"])db.collection(kind).onSnapshot(snap=>{const next=new Set(snap.docs.map(d=>d.id));for(const k of S.busy)if(k.startsWith(kind+"/")){const d=k.slice(kind.length+1);S[kind].has(d)?next.add(d):next.delete(d)}S[kind]=next;S.loaded[kind]=true;render()},fail);
  db.doc("config/settings").onSnapshot(snap=>{if(snap.exists){S.settings=mergeSettings(snap.data());applyColors()}render()},fail);
}

/* ---------- derived ---------- */
function viewStart(){const s=parts(S.settings.startMonth+"-01"),start=mIdx(s.y,s.m),t=parts(todayISO()),cur=mIdx(t.y,t.m),k=S.settings.months;
  return start+Math.floor((cur-start)/k)*k+S.offset*k}
function itemsByDate(from,to){const map=new Map();for(const it of itemsList()){const a=it.date>from?it.date:from,b=endOf(it)<to?endOf(it):to;if(a>b)continue;for(let d=a;d<=b;d=addDays(d,1)){if(!map.has(d))map.set(d,[]);map.get(d).push(it)}}
  for(const v of map.values())v.sort((x,y)=>sortKey(x)<sortKey(y)?-1:1);return map}
function actCount(kind,from,to){let n=0;for(const d of S[kind])if(d>=from&&d<=to)n++;return n}
function upcoming(includeEvents){const t=todayISO();return itemsList().filter(it=>it.date>=t&&(includeEvents||!isEvent(it)))
  .sort((a,b)=>(a.done?1:0)-(b.done?1:0)||(a.date<b.date?-1:a.date>b.date?1:0)||(sortKey(a)<sortKey(b)?-1:1))}
function onColor(hex){const n=parseInt(hex.slice(1),16),c=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return (.2126*c[0]+.7152*c[1]+.0722*c[2])>.2?"#1A1600":"#FFFFFF"}
function colorDecls(){const o=[...GROUPS.map(([g])=>["--c-"+g,S.settings.colors[g]]),["--c-event",S.settings.colors.event]];for(const [a] of ACTS){const v=S.settings.colors[a];if(v&&v.toLowerCase()!==DEFAULTS.colors[a].toLowerCase())o.push(["--"+a,v],["--on-"+a,onColor(v)])}return o}
function applyColors(){const r=document.documentElement.style;for(const [a] of ACTS){r.removeProperty("--"+a);r.removeProperty("--on-"+a)}for(const [k,v] of colorDecls())r.setProperty(k,v)}

/* ---------- school terms ---------- */
const mondayOf=s=>addDays(s,-dowMon0(s));
const goodTerms=()=>(S.settings.terms||[]).filter(x=>x.start&&x.end&&x.end>=x.start);
function termWeek(monday){const sun=addDays(monday,6);for(const x of goodTerms())if(x.start<=sun&&x.end>=monday)return {name:x.name||"Term",week:Math.floor(diffDays(mondayOf(x.start),monday)/7)+1};return null}
function termOfDay(d){for(const x of goodTerms())if(x.start<=d&&x.end>=d)return {name:x.name||"Term",week:Math.floor(diffDays(mondayOf(x.start),mondayOf(d))/7)+1};return null}

/* ---------- render: header ---------- */
function renderHeader(){const t=todayISO(),p=parts(t),left=diffDays(t,iso(p.y,12,31))+1;
  const tw=termOfDay(t);
  $("todayline").innerHTML="<b>"+esc(longDate(t))+"</b> · "+(tw?"<b>"+esc(tw.name)+", week "+tw.week+"</b> · ":"")+left+" day"+(left===1?"":"s")+" left in "+p.y;
  $("addBtn").disabled=S.offline;}

/* ---------- render: calendar ---------- */
function renderCalendar(){
  const t=todayISO(),k=S.settings.months,v0=viewStart(),first=fromMIdx(v0),last=fromMIdx(v0+k-1);
  $("rangeLabel").textContent=(first.y===last.y?MON3[first.m-1]+" – "+MON3[last.m-1]+" "+last.y:MON3[first.m-1]+" "+first.y+" – "+MON3[last.m-1]+" "+last.y);
  $("todayBtn").disabled=S.offset===0;
  for(const b of $("monthsSeg").querySelectorAll("button"))b.setAttribute("aria-pressed",String(+b.dataset.m===k));
  const spread=$("spread");spread.style.setProperty("--months",k);
  const from=iso(first.y,first.m,1),to=iso(last.y,last.m,dim(last.y,last.m)),byDate=itemsByDate(from,to);
  let html="";

  $("itemForm").addEventListener("submit",async e=>{e.preventDefault();const err=$("f-err");
    const body={date:$("f-date").value,end:$("f-end").value||"",subject:subjSel.value,name:$("f-name").value.trim(),type:typeSel.value,weight:$("f-weight").value.trim(),notes:$("f-notes").value.trim(),done:$("f-done").checked,color:typeSel.value==="Event"&&chosen?chosen:"",updated:Date.now()};
    const miss=[];if(!/^\d{4}-\d{2}-\d{2}$/.test(body.date))miss.push("a date");if(!body.subject)miss.push("a subject");if(!body.name)miss.push("a name");
    if(miss.length){err.textContent="Add "+miss.join(", ").replace(/, ([^,]*)$/," and $1")+" to save.";err.hidden=false;return}
    if(body.end&&body.end<body.date){err.textContent="The end date is before the start date.";err.hidden=false;return}
    if(body.end===body.date)body.end="";
    body.created=(it&&it.created)||Date.now();
    $("f-save").disabled=true;const ok=await saveItem(id,body);if(ok){closeModal();toast(it?"Saved":"Added to "+shortDate(body.date))}else $("f-save").disabled=false});
  const del=$("f-del");if(del)del.addEventListener("click",async()=>{if(del.dataset.armed!=="1"){del.dataset.armed="1";del.textContent="Click again to delete";return}if(await deleteItem(id)){closeModal();toast("Deleted")}});
  setTimeout(()=>{const f=$(it?"f-name":"f-subject");f&&f.focus()},30)}

async function renameItems(from,to){if(S.offline||S.readOnly||!S.db)return;for(const [id,it] of [...S.items]){if(it.subject!==from)continue;const next=Object.assign({},it,{subject:to});S.items.set(id,next);try{await S.db.doc("items/"+id).set(next)}catch(e){writeError(e);break}}render()}
/* ---------- downloads ---------- */
async function offer(filename,data){if(!S.dl){toast("Downloads aren't available in this view.");return}
  try{await S.dl.save({filename,data});toast("Saved "+filename)}catch(e){if(e&&e.code==="declined")return;toast("Couldn't save the file.")}}
function backupObj(){return {app:"wall-calendar",version:1,exported:new Date().toISOString(),settings:S.settings,items:itemsList().map(it=>{const o=Object.assign({},it);return o}),gym:[...S.gym].sort(),run:[...S.run].sort()}}
function csv(){const q=v=>{v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[["Date","End date","Subject","Name","Type","Weighting","Notes","Completed"]];
  for(const it of itemsList().sort((a,b)=>a.date<b.date?-1:1))rows.push([it.date,it.end||"",it.subject,it.name,it.type,it.weight,it.notes,it.done?"Yes":"No"]);
  return rows.map(r=>r.map(q).join(",")).join("\n")}
function printable(){const css=$("css").textContent,spread=$("spread").outerHTML,legend="",range=$("rangeLabel").textContent,fonts=document.querySelector('link[rel="stylesheet"]').href;
  const vars=colorDecls().map(([k,v])=>k+":"+v).join(";");
  return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wall Calendar '+esc(range)+'</title><link rel="stylesheet" href="'+fonts+'"><style>'+css+"\n:root{"+vars+"}\nhtml,body{height:auto}body{margin:0}.app{gap:10px}.lane:not([aria-pressed=\"true\"]){visibility:hidden}.lanes{height:6px!important}.hint{display:none}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}.day:not(.pad):hover{box-shadow:none}.spread{--row:84px}@media print{.spread{--row:62px}}</style></head><body><div class=\"app\"><div class=\"top\"><div class=\"brand\"><div class=\"wordmark\">Wall Calendar</div><div class=\"todayline\">"+esc(range)+" · printed "+esc(shortDate(todayISO()))+"</div></div></div>"+spread+legend+"</div></body></html>"}
async function restore(file){const msg=$("restoreMsg");let data;try{data=JSON.parse(await file.text())}catch(e){msg.innerHTML='<p class="err">That file isn\'t a Wall Calendar backup.</p>';return}
  if(!data||data.app!=="wall-calendar"||!Array.isArray(data.items)||!Array.isArray(data.gym)){msg.innerHTML='<p class="err">That file isn\'t a Wall Calendar backup.</p>';return}
  const items=data.items.filter(it=>it&&typeof it.id==="string"&&/^[A-Za-z0-9_\-.~:@+]{1,120}$/.test(it.id)&&/^\d{4}-\d{2}-\d{2}$/.test(it.date||"")),gym=data.gym.filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)),run=(Array.isArray(data.run)?data.run:[]).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d));
  msg.innerHTML='<p>Found '+items.length+" items, "+gym.length+" gym days and "+run.length+' runs. Restoring adds them and keeps what\'s already here.</p><div class="row"><button class="btn primary" type="button" id="doRestore">Restore</button></div>';
  $("doRestore").addEventListener("click",async()=>{if(!canWrite())return;const b=$("doRestore");b.disabled=true;let done=0;
    try{for(const it of items){const body=Object.assign({},it);delete body.id;await S.db.doc("items/"+it.id).set(body);done++;b.textContent="Restoring… "+done}
      for(const d of gym){await S.db.doc("gym/"+d).set({date:d,at:Date.now()});done++;b.textContent="Restoring… "+done}
      for(const d of run){await S.db.doc("run/"+d).set({date:d,at:Date.now()});done++;b.textContent="Restoring… "+done}
      if(data.settings){S.settings=mergeSettings(data.settings);await S.db.doc("config/settings").set(clone(S.settings));applyColors()}
      msg.innerHTML="<p>Restored.</p>";render()}catch(e){writeError(e);b.disabled=false;b.textContent="Restore"}})}

/* ---------- events ---------- */
document.addEventListener("click",e=>{const el=e.target.closest("[data-act],[data-close],[data-add],[data-edit],[data-item],[data-filter],[data-m],[data-view],[data-sdel],.day[data-date]");
  if(!el)return;
  if(el.dataset.act){e.stopPropagation();toggleAct(el.dataset.act,el.dataset.date);return}
  if(el.dataset.close){closeModal();return}
  if(el.dataset.add){if(S.offline){canWrite();return}openForm(null,el.dataset.add!=="1"?el.dataset.add:null);return}
  if(el.dataset.edit){openForm(el.dataset.edit);return}
  if(el.dataset.view){setView(el.dataset.view);return}
  if(el.dataset.filter){itemFilter=el.dataset.filter;renderItems();return}
  if(el.dataset.m){S.settings.months=+el.dataset.m;S.offset=0;saveSettings();return}
  if(el.dataset.sdel!==undefined){const i=+el.dataset.sdel;if(S.settings.subjects.length<=1)return;S.settings.subjects.splice(i,1);saveSettings();renderSettings();return}
  if(el.dataset.item){if(e.target.closest("[data-done]"))return;const it=S.items.get(el.dataset.item);if(!it)return;if(el.classList.contains("chip"))openDay(it.date);else openForm(el.dataset.item);return}
  if(el.classList.contains("day")&&el.dataset.date){openDay(el.dataset.date);return}});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.done){toggleDone(t.dataset.done);return}
  if(t.id==="evToggle"){showEvents=t.checked;renderUpcoming();return}
  if(t.id==="startMonth"&&/^\d{4}-\d{2}$/.test(t.value)){S.settings.startMonth=t.value;S.offset=0;saveSettings();return}
  for(const [attr,key] of [["tname","name"],["tstart","start"],["tend","end"]])if(t.dataset[attr]!==undefined){const x=S.settings.terms[+t.dataset[attr]];if(x){x[key]=key==="name"?t.value.trim().slice(0,24):(t.value||"");saveSettings()}return}
  if(t.dataset.color){S.settings.colors[t.dataset.color]=t.value;saveSettings();return}
  if(t.dataset.sname!==undefined){const v=t.value.trim().slice(0,60);const s=S.settings.subjects[+t.dataset.sname];if(v&&s&&v!==s.name){const old=s.name;s.name=v;s.short=v.slice(0,14);saveSettings();renameItems(old,v)}return}
  if(t.dataset.sgroup!==undefined){S.settings.subjects[+t.dataset.sgroup].group=t.value;saveSettings();return}
  if(t.id==="restoreFile"&&t.files&&t.files[0]){restore(t.files[0]);t.value=""}});
document.addEventListener("click",e=>{const id=e.target.id;
  if(id==="resetColors"){S.settings.colors=clone(DEFAULTS.colors);saveSettings();renderSettings()}
  else if(id==="addSubject"){S.settings.subjects.push({name:"New subject",short:"New",group:"other"});saveSettings();renderSettings()}
  else if(id==="dlJson")offer("wall-calendar-backup-"+todayISO()+".json",JSON.stringify(backupObj(),null,2));
  else if(id==="dlCsv")offer("assessments-"+todayISO()+".csv",csv());
  else if(id==="dlPrint"){const was=S.view;if(was!=="calendar"){S.view="calendar";render()}const html=printable();if(was!=="calendar"){S.view=was;render()}offer("wall-calendar-"+$("rangeLabel").textContent.replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase()+".html",html)}});
$("prevBtn").addEventListener("click",()=>{S.offset--;render()});
$("nextBtn").addEventListener("click",()=>{S.offset++;render()});
$("todayBtn").addEventListener("click",()=>{S.offset=0;render()});
$("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("overlay").hidden){closeModal();return}
  const d=e.target.closest&&e.target.closest(".day[data-date]");if(d&&(e.key==="Enter"||e.key===" ")&&e.target===d){e.preventDefault();openDay(d.dataset.date)}});
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.view==="calendar")sizeRows()},120)});

document.addEventListener("click",e=>{const b=e.target.closest("[data-tdel],#addTerm");if(!b)return;
  if(b.id==="addTerm"){S.settings.terms.push({name:"",start:"",end:""});saveSettings();renderSettings();const i=S.settings.terms.length-1;setTimeout(()=>{const n=$("term-name-"+i);n&&n.focus()},0);return}
  S.settings.terms.splice(+b.dataset.tdel,1);saveSettings();renderSettings()});

/* ---------- the day turns over by itself ---------- */
let lastDay=todayISO();
function tick(){const t=todayISO();if(t!==lastDay){lastDay=t;S.offset=0;render()}}
setInterval(tick,60000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});

/* ---------- boot ---------- */
try{const v=localStorage.getItem("wc-view");if(v&&["calendar","upcoming","items","settings"].includes(v))S.view=v}catch(e){}
applyColors();if(S.view==="settings")renderSettings();render();connect();
})();
</script>
